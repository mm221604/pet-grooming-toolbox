<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客訴回覆範本產生器｜寵物美容工具箱範本</title>
<style>
  :root{
    --bg:#fdf8f4; --card:#ffffff; --line:#ecdfd4; --ink:#33291f; --muted:#8a7b6d;
    --accent:#d9793f; --accent-soft:#fbeade;
    --ok:#4a7c59; --ok-soft:#eaf3ed; --warn:#b3541e; --warn-soft:#fdf0e6;
    --danger:#c0392b; --danger-soft:#fdecea;
    --shadow:0 1px 2px rgba(90,60,40,.05), 0 8px 24px rgba(90,60,40,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1815; --card:#26211d; --line:#3a322b; --ink:#f0e8e0; --muted:#a29486;
      --accent:#e08a52; --accent-soft:#3a2a1e;
      --ok:#7fb08e; --ok-soft:#233029; --warn:#e0925f; --warn-soft:#3a2b20;
      --danger:#f08578; --danger-soft:#3a221f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0 0 60px;background:var(--bg);color:var(--ink);line-height:1.7;
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  .wrap{max-width:660px;margin:0 auto;padding:0 18px}

  header{background:linear-gradient(140deg,var(--accent) 0%,#c4642f 100%);color:#fff;
         padding:34px 18px 30px;margin-bottom:26px}
  header .in{max-width:660px;margin:0 auto}
  header .back{display:inline-block;color:#fff;opacity:.9;text-decoration:none;font-size:.88rem;
               margin-bottom:12px}
  header .back:hover{opacity:1;text-decoration:underline}
  header h1{margin:0 0 6px;font-size:1.5rem;letter-spacing:1px;font-weight:800}
  header p{margin:0;opacity:.93;font-size:.92rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:22px;box-shadow:var(--shadow);margin-bottom:18px}

  .f{margin-bottom:16px}
  .f:last-child{margin-bottom:0}
  .f label{display:block;font-weight:700;margin-bottom:7px;font-size:.96rem}
  .f .note{color:var(--muted);font-size:.84rem;margin-top:5px;line-height:1.5}
  input[type=number],input[type=text],input[type=date],select,textarea{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
  textarea{resize:vertical;min-height:110px;line-height:1.7}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
         linear-gradient(135deg,var(--muted) 50%,transparent 50%);
         background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
         background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{padding:9px 15px;border:2px solid var(--line);border-radius:11px;background:var(--bg);
                color:var(--ink);font:inherit;font-size:.94rem;cursor:pointer}
  .chips button.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700;color:var(--accent)}

  .checks{display:flex;flex-direction:column;gap:8px}
  .checks button{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
                 padding:11px 13px;border:2px solid var(--line);border-radius:11px;background:var(--bg);
                 color:var(--ink);font:inherit;font-size:.94rem;cursor:pointer;line-height:1.5}
  .checks button .bx{flex:0 0 20px;height:20px;border:2px solid var(--line);border-radius:5px;
                     display:flex;align-items:center;justify-content:center;font-size:.72rem;
                     color:transparent;margin-top:1px}
  .checks button.on{background:var(--accent-soft);border-color:var(--accent)}
  .checks button.on .bx{background:var(--accent);border-color:var(--accent);color:#fff}

  .go{width:100%;padding:16px;border:0;border-radius:13px;background:var(--accent);color:#fff;
      font:inherit;font-size:1.08rem;font-weight:800;letter-spacing:1px;cursor:pointer;margin-top:4px}
  .go:hover{filter:brightness(1.06)}

  .out{display:none}
  .out.on{display:block;animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .big{font-size:2.6rem;font-weight:800;color:var(--accent);line-height:1.2;margin:4px 0}
  .lead{text-align:center;padding:8px 0 4px}
  .lead .cap{color:var(--muted);font-size:.88rem;letter-spacing:2px}

  .rows{margin-top:10px}
  .row{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.96rem}
  .row:last-child{border-bottom:0}
  .row .k{flex:0 0 34%;color:var(--muted)}
  .row .v{flex:1;font-weight:700}

  .tip{border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;
       padding:12px 15px;margin-top:14px;font-size:.93rem;line-height:1.65}
  .tip.ok{border-left-color:var(--ok);background:var(--ok-soft)}
  .tip.warn{border-left-color:var(--warn);background:var(--warn-soft)}
  .tip.danger{border-left-color:var(--danger);background:var(--danger-soft)}
  .tip b{display:block;margin-bottom:3px}

  .copybox{position:relative}
  .copy{width:100%;padding:13px;border:1px solid var(--accent);border-radius:11px;
        background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:800;
        cursor:pointer;margin-top:10px}
  .copy:hover{background:var(--accent);color:#fff}

  .demo{background:var(--warn-soft);border-left:5px solid var(--warn);border-radius:0 12px 12px 0;
        padding:11px 15px;margin-bottom:18px;font-size:.88rem;line-height:1.6}
  .demo b{color:var(--warn)}

  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px;line-height:1.8}
</style>
</head>
<body>

<header>
  <div class="in">
    <a class="back" href="index.html">← 回到 24 個範本</a>
    <h1>客訴回覆範本產生器</h1>
    <p>選客訴類型和你的立場 → 產生一段得體的回覆</p>
  </div>
</header>

<div class="wrap">

  <div class="demo">
    <b>這是範本</b>給你看「做出來大概長什麼樣」。裡面的數字和建議都是<strong>示意用的假資料</strong>——
    你自己做的時候，要換成你查證過的內容。
  </div>

  <div class="card">
    <div class="f"><label for="owner">飼主稱呼</label><input type="text" id="owner" placeholder="例如：王小姐"></div>
    <div class="f"><label for="pet">毛孩名字</label><input type="text" id="pet" placeholder="例如：小白"></div>
    <div class="f"><label>客訴內容</label><div class="chips" id="type"><button type="button" data-v="style" class="on">剪得不滿意</button><button type="button" data-v="short">覺得剪太短</button><button type="button" data-v="hurt">說毛孩受傷了</button><button type="button" data-v="time">等太久</button><button type="button" data-v="price">覺得太貴</button></div></div>
    <div class="f"><label>你評估後的立場</label><div class="chips" id="stand"><button type="button" data-v="sorry" class="on">確實是我們的疏失</button><button type="button" data-v="explain">有原因，需要說明</button><button type="button" data-v="check">還不確定，要先了解</button></div></div>
    <button class="go" id="go">產生回覆</button>
  </div>

  <div class="card out" id="out"></div>

  <footer>
    寵物美容工具箱　·　24 個題目範本<br>
    AI 資訊素養與應用（通識3）｜教學示範用途，內容為虛構範例，不構成專業建議
  </footer>

</div>

<script>

function $(id){ return document.getElementById(id); }
function v(id){ return $(id).value.trim(); }
function n(id){ return parseFloat($(id).value); }
function chip(id){
  const box=$(id), on=box.querySelector("button.on");
  box.onclick=function(e){
    const b=e.target.closest("button"); if(!b) return;
    [...box.querySelectorAll("button")].forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
  };
  return function(){ const s=box.querySelector("button.on"); return s?s.dataset.v:""; };
}
function checks(id){
  const box=$(id);
  box.onclick=function(e){
    const b=e.target.closest("button"); if(!b) return;
    b.classList.toggle("on");
  };
  return function(){ return [...box.querySelectorAll("button.on")].map(function(b){return b.dataset.v;}); };
}
function show(html){ const o=$("out"); o.innerHTML=html; o.classList.add("on"); o.scrollIntoView({behavior:"smooth",block:"nearest"}); }
function lead(cap,big,sub){ return '<div class="lead"><div class="cap">'+cap+'</div><div class="big">'+big+'</div>'+(sub?'<div>'+sub+'</div>':'')+'</div>'; }
function rows(a){ return '<div class="rows">'+a.map(function(r){return '<div class="row"><div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>';}).join("")+'</div>'; }
function tip(kind,title,body){ return '<div class="tip '+kind+'"><b>'+title+'</b>'+body+'</div>'; }
function copyBox(text){
  return '<div class="copybox"><textarea id="gen" style="min-height:170px">'+text.replace(/</g,"&lt;")+'</textarea>'+
         '<button class="copy" id="cp">📋 複製，貼給飼主／同事</button></div>';
}
function bindCopy(){
  const b=$("cp"); if(!b) return;
  b.onclick=function(){
    const t=$("gen"); t.select();
    const done=function(){ b.textContent="✅ 已複製"; setTimeout(function(){b.textContent="📋 複製，貼給飼主／同事";},1800); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.value).then(done).catch(function(){ document.execCommand("copy"); done(); });
    } else { document.execCommand("copy"); done(); }
  };
}
function fmtDate(d){ return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
function addDays(d,k){ const x=new Date(d.getTime()); x.setDate(x.getDate()+k); return x; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

const type=chip("type"), stand=chip("stand");
const OPEN={
 style:"關於造型的部分", short:"關於長度的部分", hurt:"關於您提到的狀況",
 time:"關於等待時間", price:"關於費用的部分"
};
const BODY={
 "style|sorry":"這次的成果和您期待的有落差，是我們沒有先確認清楚，真的很抱歉。",
 "style|explain":"這次的修剪是依照當天毛況做的調整，可能和您想像的不太一樣，我跟您說明一下原因。",
 "style|check":"想先了解一下您覺得不對的是哪個部分，這樣我才知道問題在哪。",
 "short|sorry":"剪得比您預期的短，是我們溝通不夠仔細，很抱歉。",
 "short|explain":"當天毛髮打結的狀況比較嚴重，硬梳會讓"+"牠"+"很痛，所以我們評估後才剃短。這部分當下應該要更清楚地跟您確認，是我們的疏忽。",
 "short|check":"想確認一下您希望的長度大概是多少，下次我會特別註記。",
 "hurt|sorry":"聽到這個消息我們非常在意。如果是我們造成的，我們一定負起責任。",
 "hurt|explain":"我們在美容前有記錄到該部位原本就有狀況，我把當天的紀錄提供給您參考。不過還是想先確認"+"牠"+"現在還好嗎？",
 "hurt|check":"想先確認"+"牠"+"目前的狀況，方便的話可以拍張照片給我嗎？我們會一起釐清。",
 "time|sorry":"讓您等這麼久，是我們排程沒有安排好，很抱歉。",
 "time|explain":"當天前一位客人的毛況比預期複雜，處理時間拉長了。我們應該要提前通知您，這點是我們的疏忽。",
 "time|check":"想確認一下當天大約等了多久，我們會檢討排程。",
 "price|sorry":"費用的部分我們事前沒有說清楚，讓您有被多收的感覺，很抱歉。",
 "price|explain":"這次的金額包含了除結處理的部分，因為打結的狀況需要額外時間。這部分我們應該在開始前就先告知。",
 "price|check":"想跟您核對一下這次的項目，看看是哪個部分和您認知的不一樣。"
};
const CLOSE={
 sorry:"我們會檢討作業流程。這次的費用我們想為您做補償，也希望還有機會為 "+"" +"服務。",
 explain:"如果說明之後您還是覺得不妥，請直接告訴我，我們一起想辦法。",
 check:"了解狀況之後我會盡快回覆您，謝謝您願意讓我們知道。"
};
$("go").onclick=function(){
  const owner=v("owner")||"您", pet=v("pet")||"毛孩";
  const key=type()+"|"+stand();
  let t=owner+"您好，\n\n";
  t+="謝謝您願意告訴我們這件事，也很抱歉造成您的困擾。\n\n";
  t+=OPEN[type()]+"——"+BODY[key].replace(/牠/g, pet)+"\n\n";
  t+=CLOSE[stand()].replace("為  服務","為 "+pet+" 服務")+"\n\n";
  t+="再次感謝您的回饋。";
  show(copyBox(t)+
    tip("","用之前一定要改","這只是<b>骨架</b>。實際回覆要加上這次的具體細節，直接照抄會很像罐頭訊息。")+
    tip("warn","三個原則","<b>① 先謝謝對方願意講</b>　<b>② 不要先急著辯解</b>　<b>③ 不確定的事不要下結論</b>")+
    tip("danger","涉及受傷時","如果飼主說毛孩受傷，<b>不要在訊息裡承認或否認責任</b>。先關心狀況、先了解事實，必要時請店長或主管處理。"));
  bindCopy();
};
</script>
</body>
</html>
