<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>犬貓危險食物查詢</title>
<style>
  :root{
    --bg:#fdf8f4; --card:#ffffff; --line:#ecdfd4; --ink:#33291f; --muted:#8a7b6d;
    --accent:#d9793f; --accent-soft:#fbeade;
    --hi:#c0392b; --hi-bg:#fdecea; --mid:#c07a1e; --mid-bg:#fdf4e3; --lo:#4a7c59; --lo-bg:#eaf3ed;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1815; --card:#26211d; --line:#3a322b; --ink:#f0e8e0; --muted:#a29486;
      --accent:#e08a52; --accent-soft:#3a2a1e;
      --hi:#f08578; --hi-bg:#3a221f; --mid:#e0aa5c; --mid-bg:#33291a; --lo:#7fb08e; --lo-bg:#233029;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px 60px;background:var(--bg);color:var(--ink);line-height:1.7;
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  .wrap{max-width:640px;margin:0 auto}
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:.88rem;margin-bottom:16px}
  .back:hover{color:var(--accent)}
  header{text-align:center;margin-bottom:20px}
  h1{margin:0 0 6px;font-size:1.6rem;letter-spacing:1px}
  .sub{color:var(--muted);font-size:.9rem}

  .alert{background:var(--hi-bg);border-left:4px solid var(--hi);border-radius:0 10px 10px 0;
         padding:12px 15px;margin-bottom:18px;font-size:.9rem}
  .alert b{color:var(--hi)}

  .bar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
  input[type="search"],select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;
       background:var(--card);color:var(--ink);font:inherit}
  input[type="search"]{flex:1;min-width:180px}

  .count{color:var(--muted);font-size:.85rem;margin-bottom:10px}

  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
        margin-bottom:11px}
  .item .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .item h3{margin:0;font-size:1.1rem}
  .lv{padding:2px 11px;border-radius:20px;font-size:.76rem;font-weight:800;letter-spacing:.5px}
  .lv.high{background:var(--hi-bg);color:var(--hi)}
  .lv.mid{background:var(--mid-bg);color:var(--mid)}
  .lv.low{background:var(--lo-bg);color:var(--lo)}
  .who{margin-left:auto;font-size:.82rem;color:var(--muted);white-space:nowrap}
  .item p{margin:4px 0;font-size:.92rem}
  .item .sym{color:var(--muted);font-size:.87rem}

  .none{text-align:center;color:var(--muted);padding:36px 0}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:26px;line-height:1.8}

  /* ===== 改版：頁首、圖表（蓋過上面舊的設定） ===== */
  :root{--z-ok:#5fa36f;--z-mid:#e6bd4f;--z-warn:#e08a3c;--z-danger:#cf4b3c;--h1:#e08548;--h2:#b8562a;
        --on-accent:#fff;--shadow:0 1px 2px rgba(90,60,40,.05),0 10px 30px rgba(90,60,40,.08)}
  body.t-look{--accent:#3d6b8c;--accent-soft:#e6eef4;--h1:#4f82a6;--h2:#284c69}
  @media (prefers-color-scheme: dark){ :root{--on-accent:#1c1815} body.t-look{--accent:#8ab4d4;--accent-soft:#1f2c36} }
  body{padding:0 0 60px}
  .wrap{max-width:620px;padding:0 16px}
  /* 頁首：分類色漸層＋大圖示 */
  header.top{position:relative;overflow:hidden;color:#fff;padding:26px 18px 60px;
         background:radial-gradient(circle at 88% 20%,rgba(255,255,255,.18) 0 60px,transparent 61px),
                    radial-gradient(circle at 96% 70%,rgba(255,255,255,.10) 0 90px,transparent 91px),
                    linear-gradient(140deg,var(--h1) 0%,var(--h2) 100%)}
  header.top .in{max-width:680px;margin:0 auto;position:relative}
  header.top .back{display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-size:.85rem;
               background:rgba(255,255,255,.16);padding:4px 12px;border-radius:99px;margin-bottom:16px}
  header.top .back:hover{background:rgba(255,255,255,.28)}
  .hd{display:flex;gap:16px;align-items:center}
  .hd .ico{flex:0 0 72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:2.4rem;
           background:rgba(255,255,255,.95);box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .hd .kind{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:1px;
            background:rgba(0,0,0,.18);padding:2px 10px;border-radius:99px;margin-bottom:4px}
  header.top h1{margin:0 0 2px;font-size:1.6rem;letter-spacing:1px;font-weight:800;line-height:1.3}
  header.top p{margin:0;opacity:.93;font-size:.92rem}
  .flow{display:flex;gap:6px;flex-wrap:wrap;margin:-34px 0 18px;position:relative}
  .flow span{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:99px;
             padding:5px 14px;font-size:.84rem;font-weight:700;color:var(--muted)}
  .flow span b{color:var(--accent)}


  header.top{text-align:left;margin:0}
  .card{border-radius:18px;box-shadow:var(--shadow)}
  select,input[type="number"],input[type="search"]{border-width:2px;border-radius:12px}
  button#calc{background:linear-gradient(140deg,var(--h1),var(--h2));border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.16);margin-bottom:18px}
  /* 圖表共用外框 */
  .viz{margin-top:16px;padding:14px 16px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
  .viz h4{margin:0 0 8px;font-size:.84rem;color:var(--muted);font-weight:700;letter-spacing:1px}

  /* 圖表：區段量尺 */
  .gauge{position:relative;padding-top:36px}
  .gbar,.glab{display:flex}
  .gbar{height:14px;border-radius:99px;overflow:hidden}
  .gbar i{height:100%;opacity:.9}
  .glab span{text-align:center;font-size:.74rem;color:var(--muted);padding-top:4px;white-space:nowrap;overflow:hidden}
  .gmark{position:absolute;top:0;transform:translateX(-50%);text-align:center;transition:left .6s ease}
  .gmark b{display:block;background:var(--ink);color:var(--bg);font-size:.8rem;padding:2px 9px;border-radius:8px;white-space:nowrap}
  .gmark::after{content:"";display:block;width:0;height:0;margin:0 auto;border:6px solid transparent;border-top-color:var(--ink)}
  .gends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
  .z-ok{background:var(--z-ok)} .z-mid{background:var(--z-mid)} .z-warn{background:var(--z-warn)}
  .z-danger{background:var(--z-danger)} .z-acc{background:var(--accent)}

  /* 圖表：橫條 */
  .bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
  .bars .bl{font-size:.86rem;white-space:nowrap}
  .bars .bt{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
  .bars .bt i{display:block;height:100%;border-radius:99px;animation:grow .7s ease}
  .bars .bv{font-weight:800;font-size:.88rem;white-space:nowrap}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .bars .bt i{transform-origin:left}

  /* 圖表：堆疊條 */
  .stack{display:flex;height:32px;border-radius:10px;overflow:hidden;gap:2px}
  .stack i{display:grid;place-items:center;color:#fff;font-style:normal;font-size:.78rem;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.82rem;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}


  #viz{text-align:left}
  @media (max-width:480px){ .hd .ico{flex-basis:58px;height:58px;font-size:2rem;border-radius:18px} header.top h1{font-size:1.35rem} }

  .item{border-left:6px solid var(--line)}
  .item.high{border-left-color:#cf4b3c} .item.mid{border-left-color:#e08a3c} .item.low{border-left-color:#e6bd4f}
  #viz{margin-bottom:6px}
</style>
</head>
<body class="t-look">
<header class="top">
  <div class="in">
    <a class="back" href="index.html">← 回工具箱首頁</a>
    <div class="hd">
      <div class="ico" aria-hidden="true">🚫</div>
      <div><span class="kind">查　選一個 → 查出說明</span><h1>犬貓危險食物查詢</h1><p>飼主問「這個能不能給牠吃」的時候，一秒查到答案</p></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="flow"><span><b>①</b> 打字搜尋</span><span><b>②</b> 篩選</span><span><b>③</b> 看能不能吃</span></div>

  <div class="alert">
    <b>⚠️ 重要：</b>本頁為<strong>教學示範用途</strong>，僅供一般參考，<strong>不能取代獸醫診斷</strong>。
    若寵物已經誤食，請<strong>立即聯絡獸醫院</strong>，不要等症狀出現。
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="輸入食物名稱，例如：巧克力、洋蔥…">
    <select id="who">
      <option value="all">狗和貓都看</option>
      <option value="dog">只看狗</option>
      <option value="cat">只看貓</option>
    </select>
    <select id="lv">
      <option value="all">所有危險程度</option>
      <option value="high">只看高危險</option>
    </select>
  </div>

  <div id="viz"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>

  <footer>
    本頁為教學示範用途，資料為一般常見資訊整理，實際情形請諮詢獸醫師。<br>
    AI 資訊素養與應用（通識3）｜課程示範作品
  </footer>

</div>

<script>

/* ===== 圖表小工具（每頁都一樣，可以直接複製到自己的網頁用） ===== */
function r1(x){ return Math.round(x*10)/10; }
function vizBox(title,inner){ return '<div class="viz">'+(title?'<h4>'+title+'</h4>':'')+inner+'</div>'; }
/* 區段量尺：zones 是 [[到哪個值,"標籤","ok|mid|warn|danger"], ...]，val 是指針位置 */
function gauge(title,val,min,max,zones,unit,txt){
  unit=unit||"";
  const pct=function(x){ return Math.max(0,Math.min(100,(x-min)/(max-min)*100)); };
  let prev=min, bar="", lab="";
  zones.forEach(function(z){
    const w=pct(z[0])-pct(prev); prev=z[0];
    bar+='<i class="z-'+z[2]+'" style="width:'+w+'%"></i>';
    lab+='<span style="width:'+w+'%">'+z[1]+'</span>';
  });
  const at=Math.max(4,Math.min(96,pct(val)));
  return vizBox(title,'<div class="gauge"><div class="gmark" style="left:'+at+'%"><b>'+(txt||r1(val)+unit)+'</b></div>'+
    '<div class="gbar">'+bar+'</div><div class="glab">'+lab+'</div>'+
    '<div class="gends"><span>'+r1(min)+unit+'</span><span>'+r1(max)+unit+'</span></div></div>');
}
/* 橫條圖：items 是 [["名稱",數值,"ok|mid|warn|danger|acc"], ...] */
function bars(title,items,unit){
  const max=Math.max.apply(null,items.map(function(x){return x[1];}))||1;
  return vizBox(title,'<div class="bars">'+items.map(function(x){
    return '<span class="bl">'+x[0]+'</span><div class="bt"><i class="z-'+(x[2]||"acc")+'" style="width:'+(x[1]/max*100)+'%"></i></div><span class="bv">'+x[1]+(unit||"")+'</span>';
  }).join("")+'</div>');
}
/* 堆疊條：items 是 [["名稱",數值,"顏色"], ...]，看各部分佔多少 */
function stack(title,items,unit){
  const list=items.filter(function(x){return x[1]>0;});
  return vizBox(title,'<div class="stack">'+list.map(function(x){
    return '<i style="flex:'+x[1]+';background:'+x[2]+'" title="'+x[0]+'">'+x[1]+'</i>';
  }).join("")+'</div><div class="legend">'+list.map(function(x){
    return '<span style="--c:'+x[2]+'">'+x[0]+' '+x[1]+(unit||"")+'</span>';
  }).join("")+'</div>');
}
/* 圓環：p 是 0～1 的比例 */
function ring(title,p,big,small,color){
  p=Math.max(0,Math.min(1,p)); const c=2*Math.PI*52;
  return vizBox(title,'<div class="ring"><svg viewBox="0 0 120 120"><circle class="rt" cx="60" cy="60" r="52"/>'+
    '<circle cx="60" cy="60" r="52" style="stroke:'+color+';stroke-dasharray:'+(c*p)+' '+c+'"/></svg>'+
    '<div><b>'+big+'</b><span>'+small+'</span></div></div>');
}
/* 時間軸：items 是 [["標題","日期","說明","done|now|soon|todo|late"], ...] */
function timeline(title,items){
  return vizBox(title,'<ol class="tl">'+items.map(function(x){
    return '<li class="'+(x[3]||"todo")+'"><div class="td">'+x[1]+'</div><div class="tt">'+x[0]+'</div>'+(x[2]?'<div class="tn">'+x[2]+'</div>':'')+'</li>';
  }).join("")+'</ol>');
}
/* 日曆格：從今天開始 weeks 週，每 every 天標一個 icon */
function cal(title,every,weeks,icon){
  let h="";
  for(let i=0;i<weeks*7;i++){
    if(i===0) h+='<span class="today">今天</span>';
    else h+='<span class="'+(i%every===0?"on":"")+'">'+(i%every===0?icon:"")+'</span>';
  }
  return vizBox(title,'<div class="cal">'+h+'</div>');
}
/* 步驟卡：list 是文字陣列 */
function steps(title,list){
  return vizBox(title,'<div class="steps">'+list.map(function(x){return '<div>'+x+'</div>';}).join("")+'</div>');
}

/* ── 資料：改這裡就能增減項目 ── */
const 食物 = [
  { 名:"巧克力", 對象:"both", 等級:"high", 原因:"含可可鹼，犬貓無法有效代謝，黑巧克力濃度最高。", 症狀:"嘔吐、心跳過快、抽搐" },
  { 名:"木糖醇（代糖）", 對象:"dog", 等級:"high", 原因:"常見於無糖口香糖、部分花生醬，極少量即可引發嚴重低血糖。", 症狀:"虛弱、癲癇、肝衰竭" },
  { 名:"葡萄、葡萄乾", 對象:"dog", 等級:"high", 原因:"確切成分不明，個體差異大，少量也可能造成腎損傷。", 症狀:"嘔吐、食慾不振、尿量減少" },
  { 名:"洋蔥、蔥、蒜、韭菜", 對象:"both", 等級:"high", 原因:"破壞紅血球，貓比狗更敏感；加熱或粉末狀一樣有毒。", 症狀:"貧血、無力、尿色變深" },
  { 名:"酒精", 對象:"both", 等級:"high", 原因:"包含含酒精的食物與未烤的麵團，代謝能力遠低於人類。", 症狀:"步態不穩、呼吸抑制" },
  { 名:"生麵團（含酵母）", 對象:"both", 等級:"high", 原因:"在胃中持續發酵膨脹並產生酒精。", 症狀:"腹脹、腹痛、酒精中毒" },
  { 名:"咖啡、茶、能量飲料", 對象:"both", 等級:"high", 原因:"咖啡因刺激心臟與神經系統。", 症狀:"躁動、心律不整、抽搐" },
  { 名:"百合（花與葉）", 對象:"cat", 等級:"high", 原因:"對貓有強烈腎毒性，花粉沾到毛再舔入也可能中毒。", 症狀:"嘔吐、嗜睡、急性腎衰竭" },
  { 名:"夏威夷豆", 對象:"dog", 等級:"mid", 原因:"機轉不明，通常 12–24 小時內出現症狀。", 症狀:"後肢無力、發抖、發燒" },
  { 名:"酪梨", 對象:"both", 等級:"mid", 原因:"果肉風險較低，但果核有阻塞風險，外皮與葉含 persin。", 症狀:"嘔吐、腹瀉" },
  { 名:"煮熟的骨頭", 對象:"both", 等級:"mid", 原因:"加熱後變脆，容易碎裂成尖銳碎片。", 症狀:"口腔割傷、腸道穿孔、便秘" },
  { 名:"過量鹽分（人類零食）", 對象:"both", 等級:"mid", 原因:"洋芋片、鹽酥雞等，鈉含量遠超過犬貓需求。", 症狀:"大量喝水、嘔吐、抽搐" },
  { 名:"桃、李、櫻桃的果核", 對象:"both", 等級:"mid", 原因:"果核含氰化物前驅物，且體積易造成阻塞。", 症狀:"呼吸急促、瞳孔放大" },
  { 名:"牛奶、乳製品", 對象:"both", 等級:"low", 原因:"多數成犬貓有乳糖不耐，不是中毒但會不舒服。", 症狀:"腹瀉、脹氣" },
  { 名:"生蛋白", 對象:"both", 等級:"low", 原因:"長期大量食用可能影響生物素吸收，另有生菌風險。", 症狀:"皮膚與毛髮狀況變差" }
];

const 等級名 = { high:"高危險", mid:"中等風險", low:"低風險" };
const 對象名 = { both:"狗・貓", dog:"狗", cat:"貓" };

function esc(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const who = document.getElementById("who").value;
  const lv = document.getElementById("lv").value;

  const 結果 = 食物.filter(function(f){
    // 條件一：對象
    if (who === "dog" && f.對象 === "cat") return false;
    if (who === "cat" && f.對象 === "dog") return false;
    // 條件二：危險程度
    if (lv === "high" && f.等級 !== "high") return false;
    // 條件三：關鍵字
    if (q && !(f.名 + f.原因 + f.症狀).toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById("count").textContent = "找到 " + 結果.length + " 筆";
  const 數 = function(k){ return 結果.filter(function(f){return f.等級===k;}).length; };
  document.getElementById("viz").innerHTML = 結果.length ? stack("目前列出的危險程度", [["高危險",數("high"),"#cf4b3c"],["中等風險",數("mid"),"#e08a3c"],["低風險",數("low"),"#c9a43a"]], " 項") : "";

  document.getElementById("list").innerHTML = 結果.length
    ? 結果.map(function(f){
        return '<div class="item ' + f.等級 + '">' +
          '<div class="top"><h3>' + esc(f.名) + '</h3>' +
          '<span class="lv ' + f.等級 + '">' + 等級名[f.等級] + '</span>' +
          '<span class="who">' + 對象名[f.對象] + '</span></div>' +
          '<p>' + esc(f.原因) + '</p>' +
          '<p class="sym">可能症狀：' + esc(f.症狀) + '</p></div>';
      }).join("")
    : '<div class="none">查不到這個項目。<br>查不到不代表安全——不確定的東西一律不要餵。</div>';
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("who").addEventListener("change", render);
document.getElementById("lv").addEventListener("change", render);
render();
</script>
</body>
</html>
